name: 3dipl

services:
  mongo:
    image: mongo:8.0
    container_name: 3dipl-mongo
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --setParameter
      - diagnosticDataCollectionEnabled=false
    restart: unless-stopped
    volumes:
      - /var/lib/3dipl/mongo:/data/db
    networks:
      - private
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: 3dipl-backend:${APP_VERSION:-local}
    container_name: 3dipl-backend
    env_file:
      - /etc/3dipl/production/backend.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /var/lib/3dipl/media/covers:/var/lib/3dipl/media/covers
      - /var/lib/3dipl/backup-work:/var/lib/3dipl/backup-work
    networks:
      - private
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_3DSMAX_PLUGIN_DOWNLOAD_URL: ${PLUGIN_DOWNLOAD_URL:-}
    image: 3dipl-frontend:${APP_VERSION:-local}
    container_name: 3dipl-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/lib/3dipl/media/covers:/var/lib/3dipl/media/covers:ro
    networks:
      - private

networks:
  private:
    driver: bridge

