name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install root tooling
        run: npm ci --ignore-scripts
      - name: Install backend
        run: npm ci --ignore-scripts --prefix backend
      - name: Install frontend
        run: npm ci --ignore-scripts --prefix frontend
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build and verify release artifact
        run: npm run build:release
      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install --with-deps chromium
      - name: Browser, API, load and memory smoke
        run: npm run qa:smoke --prefix backend -- ../frontend/dist ../qa-report/screenshots ../qa-report/performance-results/smoke.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-${{ github.sha }}
          path: |
            qa-report/screenshots
            qa-report/performance-results
          if-no-files-found: warn
          retention-days: 14
      - name: Audit root tooling
        run: npm audit
      - name: Audit backend runtime
        run: npm audit --omit=dev --prefix backend
      - name: Audit frontend toolchain
        run: npm audit --prefix frontend
