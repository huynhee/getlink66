<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DIPL - Getlink 3D</title>
  <meta name="description" content="Dịch vụ getlink trung gian tải model 3D Trung Quốc." />
  <meta name="theme-color" content="#050706" />
  <script>
    (function () {
      var colors = { dark: "#0a0a0a", light: "#faf8f5" };
      function isValidTheme(value) {
        return value === "light" || value === "dark";
      }
      function storedTheme() {
        try {
          var savedTheme = localStorage.getItem("3dipl-theme");
          return isValidTheme(savedTheme) ? savedTheme : "";
        } catch (error) {
          return "";
        }
      }
      function systemTheme() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      var theme = storedTheme() || systemTheme();
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) {
        themeMeta.setAttribute("content", colors[theme] || colors.dark);
      }
    })();
  </script>
